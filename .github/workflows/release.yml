name: Release

# v 로 시작하는 태그를 밀 때만 돈다.
# 릴리스를 만드는 행위를 태그 하나로 좁혀 두면 "어느 커밋이 v0.1.0 인가" 의 답이 저장소 안에 남는다.
on:
  push:
    tags: ['v*']

# 기본은 읽기로 둔다. 쓰기가 필요한 것은 릴리스를 실제로 만드는 마지막 잡 하나뿐이라 거기에만 준다.
# 빌드 잡은 남의 코드(액션 · Gradle 플러그인 · 의존성)를 잔뜩 실행하는 자리라, 저장소에 쓸 수 있는
# 토큰을 그 자리에 놓지 않는다.
permissions:
  contents: read

# 이 워크플로의 모양이 왜 이런가 —
#
# 예전에는 검사 · 빌드 · 릴리스가 한 잡이었다. 단계는 순서대로 도니까 테스트가 깨지면 빌드에 닿지
# 못하고, 그 시점에는 릴리스가 아직 없으므로 "자산이 반쯤 붙은 릴리스" 가 생기지 않았다.
#
# 데스크톱 앱의 dmg 가 그 한 잡을 깬다. dmg 를 만드는 jpackage 는 자기가 도는 OS 용 패키지만 만들 수
# 있어서, 맥 러너가 반드시 따로 필요하다. Go 처럼 환경 변수 두 개로 한 러너에서 셋을 다 만드는 수가
# 없다.
#
# 그래서 잡을 쪼개되, 지키던 성질은 그대로 지킨다. 각 잡은 만든 것을 릴리스가 아니라 **아티팩트**로
# 올리고, 릴리스는 넷이 전부 끝난 뒤 마지막 잡 하나가 한 번에 만든다. 하나라도 실패하면 그 잡에
# 닿지 못하므로 릴리스 자체가 생기지 않는다 — 반쯤 붙은 릴리스도, 여러 잡이 같은 릴리스에 동시에
# 올리며 부딪히는 자리도 없다.
jobs:
  # 태그 하나에서 나오는 버전을 여기서 한 번 뽑아 아래 잡들이 나눠 쓴다. 같은 문자열 자르기를
  # 잡마다 되풀이하면 셋이 조용히 갈라진다.
  #
  # 검사도 여기서 한다. 아래 잡들은 다 합쳐 십 몇 분인데, 태그 이름이 패키징에 못 쓰는 모양이면
  # 그 사실은 15 초 만에 알 수 있다.
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      desktop_version: ${{ steps.resolve.outputs.desktop_version }}
    steps:
      - name: 태그에서 데스크톱 버전 뽑기
        id: resolve
        env:
          # 태그 이름을 표현식 치환으로 스크립트에 직접 박지 않고 환경 변수로 받는다. 치환은 셸이
          # 줄을 읽기 전에 일어나므로, 이름에 섞인 따옴표나 역따옴표가 그대로 명령이 된다.
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          desktop_version="${RELEASE_TAG#v}"

          # 숫자 세 자리만 받는다. jpackage 는 버전의 각 자리를 숫자로만 받으므로 태그에서 v 를
          # 떼야 하고, rc·beta 같은 꼬리표는 붙일 수 없다. 여기서 막지 않으면 dmg 잡이 십 분을
          # 태운 끝에 영어 오류 한 줄로 죽는다.
          #
          # 앞자리가 0 이어도 받는다. 맥 jpackage 가 --app-version 의 첫 숫자 0 을 거절하는 것은
          # 그대로지만, 그 값은 desktop/build.gradle.kts 가 앞자리만 올려 따로 넘긴다 — 제품
          # 버전을 도구 제약에 맞춰 올리지 않기 위해서다. 1.0.0 은 기능 · 테스트 · 지원 플랫폼이
          # 기준을 충족했을 때 선언한다.
          if ! printf '%s' "$desktop_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::태그 '${RELEASE_TAG}' 에서 버전을 뽑을 수 없다. 릴리스 태그는 v0.9.0 처럼 v<MAJOR>.<MINOR>.<PATCH> 여야 한다 — jpackage 가 버전의 각 자리를 숫자로만 받으므로 꼬리표(rc·beta)는 붙일 수 없다."
            exit 1
          fi

          echo "desktop_version=${desktop_version}" >> "$GITHUB_OUTPUT"
          echo "데스크톱 버전: ${desktop_version}"

  # kyu 바이너리 셋. Go 는 환경 변수 두 개로 한 러너에서 세 대상을 다 만들 수 있으므로 여기는
  # 쪼개지 않는다. 대상은 설계 문서 7 절의 플랫폼 그대로다 — macOS(arm64/amd64)와 WSL(linux/amd64).
  kyu-binaries:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.mod 의 go 지시자를 단일 출처로 삼는다. 버전을 여기에 또 적으면 갈라진다.
          go-version-file: go.mod

      # 아래 검사는 ci.yml 과 같은 것을 되풀이한다. 태그는 아무 커밋에나 붙일 수 있어서
      # "그 커밋에는 CI 가 이미 돌았다" 를 전제할 수 없다. 릴리스 관문은 스스로 다시 지나야 한다.
      - name: go vet
        run: go vet ./...

      # 여기서 실패하면 아래 빌드에 닿지 못하고, 릴리스 잡에도 닿지 못한다.
      - name: go test
        run: go test ./...

      - name: 크로스 컴파일
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for platform in linux/amd64 darwin/arm64 darwin/amd64; do
            target_os="${platform%/*}"
            target_arch="${platform#*/}"
            echo "빌드: ${target_os}/${target_arch}"

            # CGO_ENABLED=0 — 러너와 같은 linux/amd64 만 기본값이 cgo 켜짐이라, 그대로 두면 셋 중
            # 이것 하나만 러너의 glibc 에 동적 링크된다. 받은 머신의 glibc 가 더 낮으면 그 자리에서
            # 죽는다. "바이너리 하나 복사로 끝"(설계 문서 8.1)이 배포 머신 사정에 걸리지 않게 묶는다.
            #
            # -trimpath — 러너의 빌드 경로가 바이너리에 박히지 않는다. 같은 태그를 다시 빌드하면
            # 같은 것이 나오므로, 받은 바이너리가 이 태그의 것인지 다시 만들어 대조할 수 있다.
            #
            # -ldflags -X — 태그 이름을 버전으로 심는다. 심볼 경로가 틀리면 링커가 조용히 무시하고
            # 넘어가므로, 이 경로가 맞는지는 cmd/kyu/main_test.go 가 붙들고 있다.
            GOOS="$target_os" GOARCH="$target_arch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-X github.com/maximinhan/Kyuchestration/internal/cli.injectedVersion=${RELEASE_TAG}" \
              -o "dist/kyu_${target_os}_${target_arch}" \
              ./cmd/kyu
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: kyu-binaries
          path: dist/kyu_*
          # 빌드가 조용히 아무것도 만들지 않았을 때, 그 사실이 릴리스 잡의 "왜 자산이 없지" 가
          # 아니라 여기서 드러나게 한다.
          if-no-files-found: error

  # 리눅스 · WSL 용 설치 패키지. 윈도우 네이티브용 msi 는 만들지 않는다 — PTY 를 여는 pty4j 가
  # ConPTY 위에서 실제로 도는지 아무도 확인한 적이 없다(app-owned-sessions-design.md 부록 A).
  # 윈도우 사용자는 WSL 안에서 이 deb 를 쓴다.
  desktop-deb:
    needs: resolve-version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            desktop/gradle/libs.versions.toml
            desktop/gradle/wrapper/gradle-wrapper.properties

      # 설치 패키지 안에 넣을 엔진을 여기서 만든다. 앱만 설치하면 끝나야 하므로, 데스크톱
      # 자산에는 kyu 가 함께 들어간다(desktop/build.gradle.kts 의 buildBundledEngine).
      #
      # kyu-binaries 잡의 산출물을 가져다 쓰지 않는다. 아티팩트는 실행 권한을 지키지 않아 내려받은
      # 자리에서 chmod 를 한 번 더 해야 하고, 그러면 이 잡이 "받아서 · 권한을 고쳐서 · 옮기는"
      # 걸음을 스스로 들고 있게 된다. 만드는 법은 Gradle 태스크 하나에만 두고, 여기서는 그것을
      # 부르기만 한다 — 로컬에서 패키징할 때와 같은 길이다.
      - uses: actions/setup-go@v5
        with:
          # kyu-binaries 잡과 같은 단일 출처를 본다. 판이 갈리면 동봉된 엔진과 따로 받은 엔진이
          # 서로 다른 컴파일러의 산출물이 된다.
          go-version-file: go.mod

      # desktop-ci.yml 은 desktop/ 이 바뀔 때만 돈다. 태그가 붙은 커밋이 그 CI 를 한 번도 지나지
      # 않았을 수 있으므로, Go 쪽과 같은 이유로 여기서 다시 지난다.
      - name: 빌드와 테스트
        run: ./gradlew --no-daemon build

      - name: 동봉할 엔진 만들기
        env:
          DESKTOP_VERSION: ${{ needs.resolve-version.outputs.desktop_version }}
        # 앱 버전을 함께 넘긴다. 태그 이름이 그대로 엔진의 버전으로 심겨, 설치한 사람이
        # `kyu version` 으로 "이 앱이 무엇을 부리고 있는가" 를 확인할 수 있다.
        run: ./gradlew --no-daemon "-PdesktopVersion=${DESKTOP_VERSION}" buildBundledEngine

      - name: deb 만들기
        env:
          DESKTOP_VERSION: ${{ needs.resolve-version.outputs.desktop_version }}
        run: ./gradlew --no-daemon "-PdesktopVersion=${DESKTOP_VERSION}" packageDeb

      - name: 자산 이름 붙이기
        env:
          DESKTOP_VERSION: ${{ needs.resolve-version.outputs.desktop_version }}
        run: |
          # jpackage 가 붙이는 이름(kyuchestration_0.9.0_amd64.deb)을 그대로 쓰지 않고 옮겨 담는다.
          # 릴리스 페이지에는 kyu 바이너리 셋과 dmg 둘이 나란히 놓이므로, 파일 이름만 보고 "어느
          # 앱의, 어느 OS · 아키텍처용" 인지 갈릴 수 있어야 한다.
          #
          # 경로를 박지 않고 찾는다 — 이름 규칙은 jpackage 와 Compose 플러그인의 것이라 판이 바뀌면
          # 같이 바뀐다. 하나가 아니면 그것이 오류다.
          built=$(find build/compose/binaries/main/deb -maxdepth 1 -name '*.deb')
          if [ "$(printf '%s\n' "$built" | grep -c .)" -ne 1 ]; then
            echo "::error::deb 가 하나만 나와야 하는데 이렇게 나왔다: ${built:-없음}"
            exit 1
          fi

          mkdir -p build/release-assets
          mv "$built" "build/release-assets/kyuchestration-desktop_${DESKTOP_VERSION}_amd64.deb"
          ls -l build/release-assets

      # 엔진이 정말 패키지 안에 들어갔는지 나가기 전에 확인한다.
      #
      # checkBundledEngine 은 "우리가 만들어 둔 자리에 있는가" 만 본다. 그 자리 이름(linux-x64)이
      # Compose 가 고르는 이름과 어긋나면 그 검사는 통과한 채로 엔진 없는 deb 가 나가고, 그 사실은
      # 받은 사람이 설치해 봐야 드러난다. 만든 것을 열어 보는 이 한 걸음이 그 사이를 잇는다.
      - name: deb 안에 엔진이 들어갔는지 확인
        run: |
          deb=$(find build/release-assets -name '*.deb')
          if ! dpkg -c "$deb" | grep -q '/app/resources/kyu$'; then
            echo "::error::deb 안에 동봉 엔진이 없다"
            dpkg -c "$deb" | grep resources || echo "(resources 디렉토리 자체가 없다)"
            exit 1
          fi
          dpkg -c "$deb" | grep '/app/resources/kyu$'

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-deb
          path: desktop/build/release-assets/*.deb
          if-no-files-found: error

  # 맥 설치 패키지. jpackage 는 자기가 도는 OS · 아키텍처용만 만들 수 있어서, 애플 실리콘과 인텔은
  # 각각 그 아키텍처의 러너가 필요하다 — 여기서만 매트릭스를 쓰는 이유다.
  #
  # 러너 이름:
  #   arm64 → macos-latest (지금은 macOS 26 arm64). 애플 실리콘이 맥의 기본이라 -latest 를 따라간다.
  #   amd64 → macos-15-intel. 인텔에는 무료 -latest 라벨이 없고(macos-latest-large 는 유료 대형
  #           러너다), 예전 기본이던 macos-13 은 이미 사라졌다. 이 라벨이 은퇴하면 이 잡이
  #           "no runner matching labels" 로 죽으므로, 그때 판을 올린다.
  desktop-dmg:
    needs: resolve-version
    runs-on: ${{ matrix.runner }}
    strategy:
      # 한쪽이 깨져도 다른 쪽 결과를 보고 싶다. 어차피 하나라도 실패하면 릴리스 잡에 닿지 못한다.
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            desktop/gradle/libs.versions.toml
            desktop/gradle/wrapper/gradle-wrapper.properties

      # deb 잡과 같은 이유로 엔진을 함께 만든다. 여기서는 러너의 아키텍처가 곧 대상이라
      # (arm64 러너 → darwin/arm64), 태스크가 이 머신을 보고 정하는 것으로 충분하다.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 빌드와 테스트
        run: ./gradlew --no-daemon build

      - name: 동봉할 엔진 만들기
        env:
          DESKTOP_VERSION: ${{ needs.resolve-version.outputs.desktop_version }}
        run: ./gradlew --no-daemon "-PdesktopVersion=${DESKTOP_VERSION}" buildBundledEngine

      - name: dmg 만들기
        env:
          DESKTOP_VERSION: ${{ needs.resolve-version.outputs.desktop_version }}
        run: ./gradlew --no-daemon "-PdesktopVersion=${DESKTOP_VERSION}" packageDmg

      - name: 자산 이름 붙이기
        env:
          DESKTOP_VERSION: ${{ needs.resolve-version.outputs.desktop_version }}
          ASSET_ARCH: ${{ matrix.arch }}
        run: |
          built=$(find build/compose/binaries/main/dmg -maxdepth 1 -name '*.dmg')
          if [ "$(printf '%s\n' "$built" | grep -c .)" -ne 1 ]; then
            echo "::error::dmg 가 하나만 나와야 하는데 이렇게 나왔다: ${built:-없음}"
            exit 1
          fi

          mkdir -p build/release-assets
          mv "$built" "build/release-assets/kyuchestration-desktop_${DESKTOP_VERSION}_${ASSET_ARCH}.dmg"
          ls -l build/release-assets

      # deb 쪽과 같은 이유로 만든 것을 열어 본다. dmg 는 붙여서(mount) 봐야 안이 보인다.
      #
      # 앱 안의 경로를 적어 두지 않고 찾는다 — .app 안의 배치는 jpackage 의 것이라 판이 바뀌면
      # 같이 바뀐다. 권한도 함께 찍는다: 앱은 이 파일을 그대로 부르지 않고 자기 자리로 복사해
      # 쓰는데(BundledEnginePlacement), 그 판단의 근거가 이 줄이다.
      - name: dmg 안에 엔진이 들어갔는지 확인
        run: |
          dmg=$(find build/release-assets -name '*.dmg')
          mountPoint=$(mktemp -d)
          hdiutil attach -nobrowse -readonly "$dmg" -mountpoint "$mountPoint"

          engine=$(find "$mountPoint" -type f -name kyu)
          if [ "$(printf '%s\n' "$engine" | grep -c .)" -ne 1 ]; then
            echo "::error::dmg 안의 동봉 엔진이 하나여야 하는데 이렇게 나왔다: ${engine:-없음}"
            hdiutil detach "$mountPoint"
            exit 1
          fi
          ls -l "$engine"

          hdiutil detach "$mountPoint"

      - uses: actions/upload-artifact@v4
        with:
          # 아티팩트 이름은 겹칠 수 없다. 매트릭스의 두 잡이 같은 이름을 쓰면 뒤엣것이 거절당한다.
          name: desktop-dmg-${{ matrix.arch }}
          path: desktop/build/release-assets/*.dmg
          if-no-files-found: error

  # 앞의 셋이 전부 끝난 뒤에야 릴리스가 생긴다. 하나라도 실패하면 이 잡에 닿지 못하므로,
  # "자산이 반쯤 붙은 릴리스" 는 만들어질 수 없다.
  release:
    needs: [kyu-binaries, desktop-deb, desktop-dmg]
    runs-on: ubuntu-latest
    permissions:
      # 릴리스를 만들고 자산을 붙이는 데 필요하다. 이 워크플로에서 쓰기를 쥔 잡은 여기 하나뿐이다.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # merge-multiple 이 아티팩트별 하위 디렉터리를 만들지 않고 파일만 한 자리에 모은다.
          # gh release create 에 파일 목록을 그대로 넘길 수 있는 모양이다.
          path: dist
          merge-multiple: true

      # gh 는 러너에 이미 들어 있다. 서드파티 릴리스 액션을 얹는 대신 이것을 쓴다 —
      # 태그를 밀 때마다 남의 저장소 코드가 쓰기 토큰을 쥐고 도는 자리를 만들지 않는다.
      - name: 릴리스 생성
        env:
          GH_TOKEN: ${{ github.token }}
          # 이 잡은 소스를 받지 않는다(자산만 있으면 된다). gh 는 현재 디렉터리의 git 원격에서
          # 저장소를 알아내므로, 받지 않은 만큼 어느 저장소인지 여기서 알려 준다.
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ls -l dist

          # dist/* 로 넘긴다. 이 자리에 도달했다는 것 자체가 여섯 개(kyu 셋 · deb 하나 · dmg 둘)가
          # 다 만들어졌다는 뜻이다.
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            dist/*
