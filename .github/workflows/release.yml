name: Release

# v 로 시작하는 태그를 밀 때만 돈다.
# 릴리스를 만드는 행위를 태그 하나로 좁혀 두면 "어느 커밋이 v0.1.0 인가" 의 답이 저장소 안에 남는다.
on:
  push:
    tags: ['v*']

# 릴리스를 만들고 바이너리를 붙이는 데 쓰기가 필요하다.
# 기본값은 읽기라, 적지 않으면 앞의 모든 단계를 통과한 뒤 마지막 한 줄에서 실패한다.
permissions:
  contents: write

jobs:
  # 검사와 릴리스를 한 잡에 둔다. 단계는 순서대로 돌므로 테스트가 깨지면 빌드에 닿지도 못하고,
  # 그 시점에는 릴리스가 아직 만들어지지 않았으므로 "자산이 반쯤 붙은 릴리스" 라는 상태가 생기지 않는다.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.mod 의 go 지시자를 단일 출처로 삼는다. 버전을 여기에 또 적으면 갈라진다.
          go-version-file: go.mod

      # 아래 검사는 ci.yml 과 같은 것을 되풀이한다. 태그는 아무 커밋에나 붙일 수 있어서
      # "그 커밋에는 CI 가 이미 돌았다" 를 전제할 수 없다. 릴리스 관문은 스스로 다시 지나야 한다.
      - name: tmux 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      # 세션 계층 테스트는 tmux 가 없으면 t.Skip 으로 넘어간다. 즉 설치가 조용히 실패하면
      # tmux 를 한 줄도 검증하지 않은 채 릴리스가 나간다. 여기서 먼저 끊는다.
      - name: tmux 설치 확인
        run: tmux -V

      - name: go vet
        run: go vet ./...

      # 여기서 실패하면 아래 빌드와 릴리스 생성에 닿지 못한다 — 그것이 릴리스를 막는 방식이다.
      - name: go test
        run: go test ./...

      # 크로스 컴파일을 strategy.matrix 로 쪼개지 않는다. 매트릭스는 대상마다 다른 러너가
      # 필요할 때 값을 하는데, go 는 환경 변수 두 개로 한 러너에서 셋을 다 만든다. 쪼개면 산출물을
      # 잡 사이로 나르는 업로드·다운로드 액션과 릴리스 전용 잡이 더 필요해지고, 한 대상만 실패하면
      # 자산이 덜 붙은 릴리스가 남는다. 셋을 다 만든 뒤에야 릴리스를 만드는 이 순서가 그것을 막는다.
      #
      # 대상은 설계 문서 7 절의 플랫폼 그대로다 — macOS(arm64/amd64)와 WSL(linux/amd64).
      # Windows 네이티브는 세션 백엔드가 아직 tmux 하나뿐이라 바이너리만 있어도 돌지 않는다(로드맵 v4).
      - name: 크로스 컴파일
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for platform in linux/amd64 darwin/arm64 darwin/amd64; do
            target_os="${platform%/*}"
            target_arch="${platform#*/}"
            echo "빌드: ${target_os}/${target_arch}"

            # CGO_ENABLED=0 — 러너와 같은 linux/amd64 만 기본값이 cgo 켜짐이라, 그대로 두면 셋 중
            # 이것 하나만 러너의 glibc 에 동적 링크된다. 받은 머신의 glibc 가 더 낮으면 그 자리에서
            # 죽는다. "바이너리 하나 복사로 끝"(설계 문서 8.1)이 배포 머신 사정에 걸리지 않게 묶는다.
            #
            # -trimpath — 러너의 빌드 경로가 바이너리에 박히지 않는다. 같은 태그를 다시 빌드하면
            # 같은 것이 나오므로, 받은 바이너리가 이 태그의 것인지 다시 만들어 대조할 수 있다.
            #
            # -ldflags -X — 태그 이름을 버전으로 심는다. 심볼 경로가 틀리면 링커가 조용히 무시하고
            # 넘어가므로, 이 경로가 맞는지는 cmd/kyu/main_test.go 가 붙들고 있다.
            GOOS="$target_os" GOARCH="$target_arch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-X github.com/maximinhan/Kyuchestration/internal/cli.injectedVersion=${RELEASE_TAG}" \
              -o "dist/kyu_${target_os}_${target_arch}" \
              ./cmd/kyu
          done
          ls -l dist

      # gh 는 러너에 이미 들어 있다. 서드파티 릴리스 액션을 얹는 대신 이것을 쓴다 —
      # 태그를 밀 때마다 남의 저장소 코드가 쓰기 토큰을 쥐고 도는 자리를 만들지 않는다.
      - name: 릴리스 생성
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # 태그 이름을 표현식 치환으로 스크립트 안에 직접 박지 않고 환경 변수로 받는다.
          # 치환은 셸이 줄을 읽기 전에 일어나므로, 이름에 섞인 따옴표나 역따옴표가 그대로 명령이 된다.
          # (이 주석도 스크립트의 일부라, 여기에 치환 문법을 예로 적으면 그것부터 평가된다.)
          #
          # dist/kyu_* 로 넘긴다. 위 단계는 빌드가 하나라도 실패하면 거기서 끝나므로, 이 자리에
          # 도달했다는 것 자체가 셋이 다 만들어졌다는 뜻이다.
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            dist/kyu_*
