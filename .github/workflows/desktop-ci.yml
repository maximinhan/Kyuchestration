name: Desktop CI

# desktop/ 이 바뀔 때만 돈다. Go 쪽 CI(ci.yml)와 트리거가 겹치면 Go 한 줄만 고쳐도
# Gradle 이 매번 도는데, 그 빌드는 아무것도 검증하지 않으면서 몇 분을 쓴다.
# push 는 main 으로 제한한다 — 작업 브랜치는 pull_request 로 이미 검사된다.
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-ci.yml'

permissions:
  contents: read

jobs:
  # 우분투와 맥 양쪽에서 돈다.
  #
  # 맥을 뒤늦게 들인 이유가 있다. 이 CI 가 우분투 하나였을 때, 맥에서만 깨지는 PTY 시험이
  # 릴리스 워크플로의 dmg 잡에서야 드러나 릴리스를 통째로 막았다(PR 28). 데스크톱 앱은 맥과
  # 리눅스 둘 다에 설치 패키지를 내는데, 검사가 한쪽에서만 돌면 나머지 한쪽은 태그를 미는
  # 순간에 처음 시험된다 — 가장 늦고 가장 비싼 자리다.
  build-and-test:
    runs-on: ${{ matrix.runner }}
    strategy:
      # 한쪽이 깨져도 다른 쪽 결과를 함께 보고 싶다. OS 별로 갈리는 실패를 다루려면 "어느 쪽이
      # 초록인가" 가 그 자체로 단서다.
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Gradle 의존성과 wrapper 배포판을 캐시한다. Compose 는 스키코 네이티브 바이너리까지
          # 받아 오기 때문에 캐시 없이는 매번 수백 MB 를 다시 내려받는다.
          cache: gradle
          cache-dependency-path: |
            desktop/gradle/libs.versions.toml
            desktop/gradle/wrapper/gradle-wrapper.properties

      # wrapper 를 커밋해 둔 이유가 "새 환경에서 Gradle 설치 없이 빌드된다" 이므로,
      # CI 도 gradle 이 아니라 ./gradlew 로 돈다. 실행 비트가 빠지면 여기서 먼저 걸린다.
      - name: Gradle wrapper 로 빌드와 테스트
        run: ./gradlew --no-daemon build

  # ── 임시 잡: install-app.sh 의 맥 경로를 실측한다. 확인하고 걷어낸다. ──────────────────
  #
  # WSL 에서는 hdiutil · codesign · spctl 을 부를 수 없어서, "curl 로 받으면 격리 속성이 붙지
  # 않는다" 는 이 스크립트의 전제를 손으로 확인할 방법이 없다. 맥 러너에서 실제 릴리스 dmg 로
  # 한 번 지나 보고 그 로그를 근거로 남긴다.
  temporary-mac-install-measurement:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    steps:
      - uses: actions/checkout@v4

      # 실측 ① — curl 로 받은 파일에 격리 속성이 붙는가. 이 스크립트 전체가 이 답 위에 서 있다.
      - name: curl 로 받은 dmg 의 확장 속성
        env:
          ASSET_ARCH: ${{ matrix.arch }}
        run: |
          asset="kyuchestration-desktop_0.9.0_${ASSET_ARCH}.dmg"
          curl -fsSL -o "/tmp/${asset}" \
            "https://github.com/maximinhan/Kyuchestration/releases/download/v0.9.0/${asset}"
          ls -l "/tmp/${asset}"

          echo "== curl 로 받은 파일의 확장 속성 =="
          xattr -l "/tmp/${asset}" || true
          echo "== com.apple.quarantine 만 =="
          xattr -p com.apple.quarantine "/tmp/${asset}" || echo "(없음 — 기대한 결과)"

      # 실측 ② — 브라우저로 받은 것과의 차이가 정말 이 속성 하나인가. 같은 파일에 속성만 붙여 본다.
      - name: 브라우저로 받은 것처럼 격리 속성을 붙인 사본
        env:
          ASSET_ARCH: ${{ matrix.arch }}
        run: |
          asset="kyuchestration-desktop_0.9.0_${ASSET_ARCH}.dmg"
          cp "/tmp/${asset}" "/tmp/quarantined-${asset}"
          xattr -w com.apple.quarantine "0083;00000000;Safari;" "/tmp/quarantined-${asset}"
          echo "== 속성을 붙인 사본 =="
          xattr -l "/tmp/quarantined-${asset}"

      # 실측 ③ — 스크립트가 처음부터 끝까지 도는가(내려받기 · 마운트 · 복사).
      #
      # 토큰을 넘긴다. 러너들은 IP 를 나눠 쓰므로 무인증 GitHub API 호출이 남의 호출과 합쳐져
      # 레이트리밋에 걸린다(arm64 러너 실측: 403). 자기 IP 를 쓰는 사용자 머신에서는 걸리지
      # 않는 자리라, 여기서만 토큰을 준다 — 스크립트의 토큰 폴백이 도는지도 함께 보게 된다.
      - name: install-app.sh 를 그대로 실행
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash install-app.sh
          ls -ld /Applications/Kyuchestration.app

      # 실측 ④ — 설치된 앱의 서명 상태와 Gatekeeper 판정. release.yml 에 ad-hoc 서명을 더할지
      # 여기 로그를 보고 정한다.
      - name: 설치된 앱의 서명 · 격리 · Gatekeeper 상태
        run: |
          app=/Applications/Kyuchestration.app

          echo "== codesign -dv =="
          codesign -dv --verbose=4 "$app" 2>&1 || echo "(서명 없음)"

          echo "== codesign --verify =="
          codesign --verify --deep --strict --verbose=2 "$app" 2>&1 || echo "(검증 실패)"

          echo "== spctl --assess =="
          spctl --assess --type execute -vv "$app" 2>&1 || echo "(Gatekeeper 거절)"

          echo "== 설치된 앱의 확장 속성 =="
          xattr -lr "$app" | head -20 || true
          echo "== com.apple.quarantine 만 =="
          xattr -p com.apple.quarantine "$app" || echo "(없음 — 기대한 결과)"

      # 실측 ⑤ — 정말 열리는가. 헤드리스 러너라 창이 못 떠도, Gatekeeper 가 막았는지 아니면
      # 화면이 없어 죽었는지는 로그로 갈린다.
      - name: 앱을 열어 본다
        run: |
          echo "== 이름으로 열기 (open -a) =="
          open -a Kyuchestration 2>&1 || echo "(이름으로는 실패)"
          echo "== 경로로 열기 (open <경로>) =="
          open /Applications/Kyuchestration.app 2>&1 || echo "(경로로도 실패)"
          sleep 10
          echo "== 프로세스 목록 =="
          ps -A -o command= | grep -F "Kyuchestration.app/Contents/MacOS" || echo "(떠 있지 않음)"
          echo "== 최근 Gatekeeper 로그 =="
          log show --last 3m --predicate 'subsystem == "com.apple.syspolicy"' --style compact 2>&1 | tail -30 || true

      # 실측 ⑥ — 실행 중인 앱을 덮어쓰지 않고 멈추는가.
      - name: 실행 중일 때의 안내
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash install-app.sh && echo "!! 실행 중인데도 그냥 설치했다" || echo "(멈췄다 — 기대한 결과)"

      # 실측 ⑦ — 브라우저로 받은 파일을 넘겼을 때 격리 속성을 떼는가.
      - name: 격리 속성이 붙은 파일을 넘겨 설치
        env:
          ASSET_ARCH: ${{ matrix.arch }}
        run: |
          killall Kyuchestration 2>/dev/null || true
          sleep 3

          bash install-app.sh "/tmp/quarantined-kyuchestration-desktop_0.9.0_${ASSET_ARCH}.dmg"

          echo "== 설치된 앱에 격리 속성이 남았는가 =="
          xattr -p com.apple.quarantine /Applications/Kyuchestration.app \
            || echo "(없음 — 스크립트가 뗐다)"
          echo "== 앱 안쪽까지 =="
          xattr -lr /Applications/Kyuchestration.app | grep -F quarantine \
            || echo "(안쪽에도 없음)"
