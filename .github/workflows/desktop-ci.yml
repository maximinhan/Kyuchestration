name: Desktop CI

# desktop/ 이 바뀔 때만 돈다. Go 쪽 CI(ci.yml)와 트리거가 겹치면 Go 한 줄만 고쳐도
# Gradle 이 매번 도는데, 그 빌드는 아무것도 검증하지 않으면서 몇 분을 쓴다.
# push 는 main 으로 제한한다 — 작업 브랜치는 pull_request 로 이미 검사된다.
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-ci.yml'

permissions:
  contents: read

jobs:
  # 우분투와 맥 양쪽에서 돈다.
  #
  # 맥을 뒤늦게 들인 이유가 있다. 이 CI 가 우분투 하나였을 때, 맥에서만 깨지는 PTY 시험이
  # 릴리스 워크플로의 dmg 잡에서야 드러나 v1.0.0 을 통째로 막았다(PR 28). 데스크톱 앱은 맥과
  # 리눅스 둘 다에 설치 패키지를 내는데, 검사가 한쪽에서만 돌면 나머지 한쪽은 태그를 미는
  # 순간에 처음 시험된다 — 가장 늦고 가장 비싼 자리다.
  build-and-test:
    runs-on: ${{ matrix.runner }}
    strategy:
      # 한쪽이 깨져도 다른 쪽 결과를 함께 보고 싶다. OS 별로 갈리는 실패를 다루려면 "어느 쪽이
      # 초록인가" 가 그 자체로 단서다.
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Gradle 의존성과 wrapper 배포판을 캐시한다. Compose 는 스키코 네이티브 바이너리까지
          # 받아 오기 때문에 캐시 없이는 매번 수백 MB 를 다시 내려받는다.
          cache: gradle
          cache-dependency-path: |
            desktop/gradle/libs.versions.toml
            desktop/gradle/wrapper/gradle-wrapper.properties

      # wrapper 를 커밋해 둔 이유가 "새 환경에서 Gradle 설치 없이 빌드된다" 이므로,
      # CI 도 gradle 이 아니라 ./gradlew 로 돈다. 실행 비트가 빠지면 여기서 먼저 걸린다.
      - name: Gradle wrapper 로 빌드와 테스트
        run: ./gradlew --no-daemon build

      # 임시 — 0.x 태그로 맥 dmg 가 실제로 만들어지는지 이 브랜치에서 한 번 실측한다.
      # dmg 패키징은 릴리스 워크플로에만 있어서 태그를 밀기 전에는 확인할 자리가 없는데,
      # 태그를 밀어 보는 것은 실패해도 되돌릴 수 없는 방법이다. 확인되면 이 스텝은 걷어낸다.
      - name: (임시) 0.x 로 dmg 를 만들고 Info.plist 를 읽는다
        if: runner.os == 'macOS'
        run: |
          ./gradlew --no-daemon -PdesktopVersion=0.8.0 packageDmg
          ls -l build/compose/binaries/main/dmg

          app=$(find build/compose/binaries/main/app -maxdepth 1 -name '*.app')
          plist="${app}/Contents/Info.plist"
          echo "CFBundleShortVersionString: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          echo "CFBundleVersion: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"
