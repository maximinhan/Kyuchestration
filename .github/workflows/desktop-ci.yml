name: Desktop CI

# desktop/ 이 바뀔 때만 돈다. Go 쪽 CI(ci.yml)와 트리거가 겹치면 Go 한 줄만 고쳐도
# Gradle 이 매번 도는데, 그 빌드는 아무것도 검증하지 않으면서 몇 분을 쓴다.
# push 는 main 으로 제한한다 — 작업 브랜치는 pull_request 로 이미 검사된다.
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-ci.yml'

permissions:
  contents: read

jobs:
  # 우분투와 맥 양쪽에서 돈다.
  #
  # 맥을 뒤늦게 들인 이유가 있다. 이 CI 가 우분투 하나였을 때, 맥에서만 깨지는 PTY 시험이
  # 릴리스 워크플로의 dmg 잡에서야 드러나 릴리스를 통째로 막았다(PR 28). 데스크톱 앱은 맥과
  # 리눅스 둘 다에 설치 패키지를 내는데, 검사가 한쪽에서만 돌면 나머지 한쪽은 태그를 미는
  # 순간에 처음 시험된다 — 가장 늦고 가장 비싼 자리다.
  build-and-test:
    runs-on: ${{ matrix.runner }}
    strategy:
      # 한쪽이 깨져도 다른 쪽 결과를 함께 보고 싶다. OS 별로 갈리는 실패를 다루려면 "어느 쪽이
      # 초록인가" 가 그 자체로 단서다.
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Gradle 의존성과 wrapper 배포판을 캐시한다. Compose 는 스키코 네이티브 바이너리까지
          # 받아 오기 때문에 캐시 없이는 매번 수백 MB 를 다시 내려받는다.
          cache: gradle
          cache-dependency-path: |
            desktop/gradle/libs.versions.toml
            desktop/gradle/wrapper/gradle-wrapper.properties

      # wrapper 를 커밋해 둔 이유가 "새 환경에서 Gradle 설치 없이 빌드된다" 이므로,
      # CI 도 gradle 이 아니라 ./gradlew 로 돈다. 실행 비트가 빠지면 여기서 먼저 걸린다.
      - name: Gradle wrapper 로 빌드와 테스트
        run: ./gradlew --no-daemon build

      # ── 임시 실측. 이 브랜치에서만 돌고 PR 을 내기 전에 걷어낸다. ──────────────────
      #
      # 리눅스에서는 이미 실측했다: jpackage 가 앱 리소스의 실행 권한을 떼어 내고(deb 안에서
      # -rw-r--r-- root/root), 그래서 앱이 그것을 자기 자리로 복사해 쓴다. 맥에서도 같은지는
      # 맥 러너에서만 알 수 있는데, 릴리스 워크플로는 태그에서만 도므로 여기서 한 번 본다.
      - uses: actions/setup-go@v5
        if: runner.os == 'macOS'
        with:
          go-version-file: go.mod

      - name: 임시 — dmg 안 동봉 엔진의 권한과 실행 여부를 실측한다
        if: runner.os == 'macOS'
        run: |
          ./gradlew --no-daemon -PdesktopVersion=0.9.0 buildBundledEngine
          ./gradlew --no-daemon -PdesktopVersion=0.9.0 packageDmg

          dmg=$(find build/compose/binaries/main/dmg -name '*.dmg')
          mountPoint=$(mktemp -d)
          hdiutil attach -nobrowse -readonly "$dmg" -mountpoint "$mountPoint"

          echo "== dmg 안의 배치와 권한 =="
          engine=$(find "$mountPoint" -type f -name kyu)
          echo "$engine"
          ls -l "$engine"

          echo "== 원본을 그대로 실행해 본다 =="
          "$engine" version || echo "직접 실행 실패 (종료 코드 $?)"

          echo "== 확장 속성(격리 표시) =="
          xattr -l "$engine" || echo "(없음)"

          echo "== 복사한 뒤 권한을 주고 실행해 본다 — 앱이 실제로 쓰는 길 =="
          cp "$engine" /tmp/kyu-copy
          chmod +x /tmp/kyu-copy
          /tmp/kyu-copy version || echo "복사본 실행 실패 (종료 코드 $?)"

          hdiutil detach "$mountPoint"
