name: Desktop CI

# desktop/ 이 바뀔 때만 돈다. Go 쪽 CI(ci.yml)와 트리거가 겹치면 Go 한 줄만 고쳐도
# Gradle 이 매번 도는데, 그 빌드는 아무것도 검증하지 않으면서 몇 분을 쓴다.
# push 는 main 으로 제한한다 — 작업 브랜치는 pull_request 로 이미 검사된다.
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      # WSL 코어 묶음이 install.sh 를 싣고, 아래 걸음들이 .github/scripts 의 스크립트를 부른다.
      - 'install.sh'
      - '.github/scripts/**'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'install.sh'
      - '.github/scripts/**'
      - '.github/workflows/desktop-ci.yml'

permissions:
  contents: read

# 판을 넘기는 것은 릴리스와 같은 길을 지나기 위해서다 — WSL 코어 묶음의 VERSION · 깔린 코어의 인사 · msi 의 판이 한 값에서 나오는지
# 본다. 두 잡(묶음 · msi)이 같은 값을 써야 해서 워크플로에 하나 둔다.
env:
  CI_DESKTOP_VERSION: '0.1.0'

jobs:
  # 우분투 · 맥에서 돈다.
  #
  # 맥을 뒤늦게 들인 이유가 있다. 이 CI 가 우분투 하나였을 때, 맥에서만 깨지는 PTY 시험이
  # 릴리스 워크플로의 dmg 잡에서야 드러나 릴리스를 통째로 막았다(PR 28). 데스크톱 앱은 맥과
  # 리눅스 둘 다에 설치 패키지를 내는데, 검사가 한쪽에서만 돌면 나머지 한쪽은 태그를 미는
  # 순간에 처음 시험된다 — 가장 늦고 가장 비싼 자리다.
  #
  # 윈도우는 아래 windows-msi 로 따로 돈다 — msi 가 우분투에서만 만들 수 있는 WSL 코어 묶음을 받아야 해서다.
  build-and-test:
    runs-on: ${{ matrix.runner }}
    strategy:
      # 한쪽이 깨져도 다른 쪽 결과를 함께 보고 싶다. OS 별로 갈리는 실패를 다루려면 "어느 쪽이
      # 초록인가" 가 그 자체로 단서다.
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Gradle 의존성과 wrapper 배포판을 캐시한다. Compose 는 스키코 네이티브 바이너리까지
          # 받아 오기 때문에 캐시 없이는 매번 수백 MB 를 다시 내려받는다.
          cache: gradle
          cache-dependency-path: |
            desktop/gradle/libs.versions.toml
            desktop/gradle/wrapper/gradle-wrapper.properties

      # wrapper 를 커밋해 둔 이유가 "새 환경에서 Gradle 설치 없이 빌드된다" 이므로,
      # CI 도 gradle 이 아니라 ./gradlew 로 돈다. 실행 비트가 빠지면 여기서 먼저 걸린다.
      - name: Gradle wrapper 로 빌드와 테스트
        run: ./gradlew --no-daemon build

      - name: 시험 결과 세기
        if: always()
        run: python3 ../.github/scripts/count-test-results.py

  # msi 에 실을 WSL 코어 묶음(core-ui-split-design.md 6.16 의 4a 정정). 묶음의 코어 이미지는 jlink 런타임을 품어 리눅스에서만
  # 만든다. 시험은 위 우분투 잡이 돌므로 여기서는 묶고 풀어 보기만 한다 — 윈도우 잡이 맥 · 우분투의 시험을 기다리지 않게 따로 둔다.
  wsl-core-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            desktop/gradle/libs.versions.toml
            desktop/gradle/wrapper/gradle-wrapper.properties

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 릴리스의 kyu-binaries 와 같은 빌드 조건(-trimpath, CGO_ENABLED=0). 태그가 없어 판은 심지 않는다 — kyu 는 커밋으로 자기를 말한다.
      - name: 리눅스 amd64 kyu 만들기
        working-directory: .
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/kyu_linux_amd64" ./cmd/kyu

      - name: 코어 이미지와 WSL 코어 묶음 만들기
        run: |
          ./gradlew --no-daemon "-PdesktopVersion=${CI_DESKTOP_VERSION}" \
            :core:packageCoreArchive :core:packageWslCoreBundle "-PwslCoreBundleKyu=$RUNNER_TEMP/kyu_linux_amd64"

      # 윈도우 화면이 WSL 에서 할 일 그대로 — 묶음을 풀어 네트워크 없이 설치하고, 깔린 코어가 같은 판으로 인사하는지 본다.
      - name: 묶음을 풀어 설치하고 인사해 보기
        run: |
          bash ../.github/scripts/verify-wsl-core-bundle.sh \
            core/build/wsl-core-bundle/kyuchestration-wsl-core.tar.gz "v${CI_DESKTOP_VERSION}" any

      - uses: actions/upload-artifact@v4
        with:
          name: wsl-core-bundle
          path: desktop/core/build/wsl-core-bundle/kyuchestration-wsl-core.tar.gz
          if-no-files-found: error

  # 윈도우는 화면이 도는 자리다(코어는 WSL 안). 코어 시험과 코어를 띄우는 화면 시험은 윈도우에서 이유와 함께 건너뛴다 — 건너뛴 수는
  # "시험 결과 세기" 가 모듈마다 적는다. msi 는 위 잡의 WSL 코어 묶음을 받아 싣는다 — 태그 없이 PR 에서 릴리스 잡과 같은 태스크를 지난다.
  windows-msi:
    needs: wsl-core-bundle
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        # 윈도우 러너의 기본 셸은 PowerShell 이다. ./gradlew 와 아래 스크립트가 다른 잡과 같게 돌도록 bash 로 맞춘다.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            desktop/gradle/libs.versions.toml
            desktop/gradle/wrapper/gradle-wrapper.properties

      - name: Gradle wrapper 로 빌드와 테스트
        run: ./gradlew --no-daemon build

      - name: 시험 결과 세기
        if: always()
        env:
          # 윈도우 러너의 파이썬은 파이프로 나가는 stdout 을 cp1252 로 써서 한국어에서 죽는다(실측). UTF-8 로 쓴다.
          PYTHONUTF8: '1'
        run: python3 ../.github/scripts/count-test-results.py

      - uses: actions/download-artifact@v4
        with:
          name: wsl-core-bundle
          path: ${{ runner.temp }}/wsl-core-bundle

      # WiX 는 Compose 플러그인이 받는다. 묶음은 Gradle 한 길(placeWslCoreBundle)로 놓는다 — 손으로 복사하면 자리 이름이 두 곳에 산다.
      - name: 묶음을 놓고 msi 만들기
        run: |
          ./gradlew --no-daemon "-PdesktopVersion=${CI_DESKTOP_VERSION}" \
            "-PwslCoreBundle=${RUNNER_TEMP}/wsl-core-bundle/kyuchestration-wsl-core.tar.gz" \
            :app:placeWslCoreBundle :app:packageMsi
          find app/build/compose/binaries/main/msi -name '*.msi' -exec ls -l {} \;

      - name: msi 안에 WSL 코어 묶음이 실렸는지 확인
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem app/build/compose/binaries/main/msi -Filter *.msi)[0].FullName
          ../.github/scripts/verify-msi-carries-wsl-core.ps1 `
            -AppImage app/build/compose/binaries/main/app `
            -Msi $msi `
            -SuppliedBundle "$env:RUNNER_TEMP/wsl-core-bundle/kyuchestration-wsl-core.tar.gz"

      # jpackage 가 실패하면 Gradle 은 로그 파일 자리만 알린다. 러너가 끝나면 그 파일은 사라지므로 여기서 펼친다.
      - name: msi 를 만들지 못했으면 jpackage 기록 펼치기
        if: failure()
        run: |
          for log in app/build/compose/logs/packageMsi/*; do
            echo "== $log"
            cat "$log"
          done
