name: CI

# push 는 main 으로 제한한다. 작업 브랜치의 push 는 어차피 pull_request 로 검사되므로
# 둘 다 켜두면 같은 커밋에 대해 워크플로가 두 번 돈다.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vet-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.mod 의 go 지시자를 단일 출처로 삼는다. 버전을 여기에 또 적으면 갈라진다.
          go-version-file: go.mod

      - name: tmux 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      # 세션 계층 테스트는 tmux 가 없으면 t.Skip 으로 넘어간다. 즉 설치가 조용히 실패하면
      # tmux 를 한 줄도 검증하지 않은 채 CI 가 초록으로 통과한다. 여기서 먼저 끊는다.
      - name: tmux 설치 확인
        run: tmux -V

      # 상태 추론 테스트도 git 이 없으면 t.Skip 으로 넘어간다. 게다가 판정이 git 의 종료 코드에
      # 기대고 있으므로(업스트림 없음 1, 레포 손상 128), 어느 버전으로 검증했는지 로그에 남긴다.
      - name: git 설치 확인
        run: git --version

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  # ── 임시 잡: security 가 표준 입력을 어떻게 다루는지 실측한다. 원인을 확정하고 걷어낸다. ────
  #
  # WSL 에는 security 가 없어서, "값 없는 -w 에 파이프로 토큰을 먹이면 그 토큰이 저장된다" 는
  # 이 코드의 전제를 손으로 확인할 방법이 없다(PR 13 이 손 검증 항목으로 남긴 자리). 맥 러너에서
  # 후보가 되는 먹이는 방식들을 한 벌로 지나 보고, 각각이 실제로 무엇을 저장하는지 로그로 남긴다.
  temporary-mac-keychain-measurement:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 어느 판에서 잰 결과인지 남긴다. security 의 프롬프트 문구와 동작은 macOS 판을 탄다.
      - name: macOS 판
        run: sw_vers

      # 버려도 되는 키체인을 기본으로 잡는다. 러너는 일회용이라 기본을 바꿔도 무방하다.
      #
      # 기본 키체인(add 가 쓰는 자리)과 검색 목록(find 가 뒤지는 자리)은 서로 다른 설정이다.
      # 하나만 바꾸면 저장은 새 키체인에, 조회는 login 키체인에 가서 항상 "항목 없음" 이 된다.
      - name: 시험용 키체인을 기본으로 잡는다
        run: |
          set -euo pipefail
          keychain_password="$(uuidgen)"

          security create-keychain -p "$keychain_password" kyu-ci.keychain
          # 자동 잠금을 끈다. 스텝 사이에 잠기면 다음 스텝은 사람에게 암호를 묻다가 멎는다.
          security set-keychain-settings kyu-ci.keychain
          security default-keychain -s kyu-ci.keychain
          security list-keychains -d user -s kyu-ci.keychain
          security unlock-keychain -p "$keychain_password" kyu-ci.keychain

          echo "== 기본 키체인 =="
          security default-keychain
          echo "== 검색 목록 =="
          security list-keychains

      # 실측 ① — 먹이는 방식별로 무엇이 저장되는가. 이 로그가 근본 수정의 근거다.
      - name: security 가 무엇을 저장하는지 잰다
        env:
          KYU_KEYCHAIN_INTEGRATION: '1'
        run: go test ./internal/secretstore/ -run TestKeychainProbe -v -count=1 -timeout 15m

      # 실측 ② — 지금 코드의 왕복. 사용자가 지난 길 그대로(신규 저장 → 조회 → 재저장 → 조회)다.
      # 이 스텝이 빨강인 것이 재현이다.
      - name: 지금 코드의 키체인 왕복
        env:
          KYU_KEYCHAIN_INTEGRATION: '1'
        run: go test ./internal/secretstore/ -run 'TestKeychainGivesBack|TestKeychainReplaces|TestKeychainReads|TestKeychainSays' -v -count=1 -timeout 15m

      - name: 시험용 키체인 정리
        if: always()
        run: |
          security list-keychains -d user -s login.keychain-db || true
          security default-keychain -s login.keychain-db || true
          security delete-keychain kyu-ci.keychain || true
