[versions]
# Compose Multiplatform 1.12.0 은 Kotlin 2.2.20 의 stdlib 로 배포됐다. 컴파일러는 그보다 새로워도
# 되지만, Compose 컴파일러 플러그인은 Kotlin 과 같은 버전으로 함께 배포되므로 두 곳에 같은
# 버전을 적지 않도록 kotlin 하나만 참조한다.
kotlin = "2.4.10"
composeMultiplatform = "1.12.0"
# Material 3 은 Compose Multiplatform 본체와 릴리스 주기가 갈라져 버전이 따로 논다. 그래서 1.12.0
# 부터 `compose.material3` 단축 접근자가 폐기되고 좌표를 직접 적게 됐다.
composeMaterial3 = "1.9.0"
# 직렬화 런타임은 컴파일러 플러그인과 판을 맞출 필요가 없다 — 플러그인은 kotlin 버전을 따라가고,
# 런타임은 그보다 새로워도 된다.
kotlinxSerializationJson = "1.11.0"
# Compose Multiplatform 1.12.0 이 코루틴 1.9.0 을 끌고 온다. 여기에 더 새 판을 적으면 테스트
# 클래스패스만 올라가 실행 때와 다른 코루틴으로 시험하게 된다. 그래서 일부러 같은 판에 못 박는다.
kotlinxCoroutines = "1.9.0"
# JediTerm 은 IntelliJ 의 터미널 위젯이다. 2.x 에서는 core·ui·pty 세 아티팩트였지만 3.x 는
# jediterm-pty 를 더 내지 않는다(그쪽은 2.69 에서 멈췄다) — pty4j 를 잇는 커넥터는 각자 쓴다.
jediterm = "3.74"
# PTY 를 여는 네이티브 구현. 리눅스·맥·윈도우용 바이너리가 이 한 아티팩트 안에 들어 있다.
pty4j = "0.13.12"

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinComposeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[libraries]
composeMaterial3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
kotlinxSerializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinxCoroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinxCoroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# 터미널 화면(Swing 위젯)과 그 아래의 터미널 모델. 화면 쪽만 적어도 core 가 딸려오지만, 우리가
# ProcessTtyConnector(core) 를 직접 상속하므로 쓰는 것을 그대로 적는다.
jeditermUi = { module = "org.jetbrains.jediterm:jediterm-ui", version.ref = "jediterm" }
jeditermCore = { module = "org.jetbrains.jediterm:jediterm-core", version.ref = "jediterm" }
pty4j = { module = "org.jetbrains.pty4j:pty4j", version.ref = "pty4j" }
